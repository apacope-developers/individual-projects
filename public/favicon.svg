<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#redGradient)" stroke="#B91C1C" stroke-width="1"/>
  
  <!-- Heart with pulse line -->
  <g transform="translate(16, 16)">
    <!-- Heart shape -->
    <path d="M -4,-2 C -4,-5 -2,-7 0,-7 C 2,-7 4,-5 4,-2 C 4,-5 6,-7 8,-7 C 10,-7 12,-5 12,-2 C 12,2 8,6 0,12 C -8,6 -12,2 -12,-2 C -12,-5 -10,-7 -8,-7 C -6,-7 -4,-5 -4,-2 Z" 
          fill="white" transform="scale(0.7) translate(-4, -2)"/>
    
    <!-- Pulse line -->
    <path d="M -8,0 L -4,0 L -2,-3 L 0,3 L 2,-2 L 4,0 L 8,0" 
          stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Medical cross overlay -->
  <g transform="translate(16, 16)">
    <rect x="-1" y="-4" width="2" height="8" fill="white" opacity="0.9"/>
    <rect x="-4" y="-1" width="8" height="2" fill="white" opacity="0.9"/>
  </g>
</svg>
